name: Backend tests

on:
  push:
    branches: [main, master, "v*"]
    paths:
      - "backend/**"
      - ".github/workflows/agent-pytest.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/agent-pytest.yml"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      # The whole suite, not a hand-maintained list. Eight failures once lived
      # on main for months because the list did not name the files that held
      # them, and every new test file had to be remembered into CI by hand.
      - name: Run backend test suite
        run: uv run pytest -q --tb=short

      - name: Smoke check (a real audit, end to end)
        # Unit tests import the thing they test, so they cannot tell you the
        # thing is reachable. Every real bug here was found by running it.
        run: uv run python scripts/smoke_audit.py

      - name: Run eval CI suite
        run: uv run python -m tests.evals.runner --ci
