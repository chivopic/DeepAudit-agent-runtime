[project]
name = "deepaudit-cli"
version = "0.2.0"
description = "Dependency-light, evidence-backed local security audit CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DeepAudit Team" }]
keywords = ["security", "audit", "semgrep", "cli", "static-analysis"]
dependencies = []

[project.scripts]
deepaudit = "deepaudit_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepaudit_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "C901"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
